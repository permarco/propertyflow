    post:
      operationId: mitarbeiterAntwortbedarfAufheben
      tags: [Mitarbeitende]
      summary: Antwortbedarf aufheben
      x-propertyflow-status: zielvertrag
      description: >
        PropertyFlow prüft die Mitarbeiterberechtigung, die Fallversion, den
        aktiven Fall und den offenen Antwortbedarf der ausgewählten externen
        Rückfrage. Der Dienst prüft serverseitig, ob die Nachrichten-ID zum
        adressierten Fall gehört. Er übergibt genau diese Rückfrage synchron
        an den zugeordneten Fallprozess. Camunda veranlasst die Aufhebung
        ausschliesslich für diese Rückfrage. Der Worker speichert die manuelle
        Aufhebung mit Nachrichten-ID, Mitarbeiteridentität und Zeitpunkt.
        Die Nachricht und ihre ursprüngliche Kennzeichnung bleiben im Verlauf.
        Andere offene Rückfragen bleiben bestehen (UC-028, KOM-03).

        Camunda veranlasst den Wechsel zu «In Bearbeitung» nur, wenn nach
        der Aufhebung keine offene Rückfrage, keine laufende Wiedervorlage
        und kein vorrangiger Mitarbeiterprüfbedarf mehr bestehen. PropertyFlow
        speichert Aufhebung und einen allfälligen Statuswechsel konsistent
        auf dem aktuellen Fallstand. Eine verspätete Auswertung reaktiviert
        den aufgehobenen Antwortbedarf nicht (FALL-05).
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [version, operation, csrf]
              properties:
                version:
                  type: integer
                  format: int64
                  description: Version des beim Aufheben geprüften Fallstands.
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
      responses:
        '200':
          description: >
