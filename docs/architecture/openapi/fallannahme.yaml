      description: >
        Das UI sendet den Auftrag nach ausdrücklicher Bestätigung im
        Wiedereröffnungsdialog. PropertyFlow prüft die Mitarbeiterberechtigung,
        die angezeigte Fallversion und ob der Fall abgeschlossen ist.
        Camunda veranlasst die Wiedereröffnung auf Grundlage der geprüften
        Mitarbeiteraktion. Der neue Status lautet «In Bearbeitung» oder bei
        offenem Prüfbedarf «Mitarbeiterprüfung erforderlich». PropertyFlow
        speichert den neuen Status gemeinsam mit Zeitpunkt und handelndem
        Mitarbeiter. Case-ID, Ursprungsdaten und Historie einschliesslich des
        bisherigen Abschlussnachweises bleiben erhalten (UC-015, FALL-07).

        Erst nach der dauerhaften Speicherung sind neue Nachrichten und
        Memos wieder zulässig. Beendete Rückfragen bleiben beendet. Alte
        Timer und verspätete automatische Ergebnisse aus der Bearbeitung
        vor dem letzten Abschluss dürfen den aktuellen Fallstand nicht
        verändern. Die technische Fortsetzung bei bereits beendeter
        Camunda-Instanz bleibt im Prozessentwurf festzulegen (SS-003).
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [version, operation, csrf]
              properties:
                version:
                  type: integer
                  format: int64
                  description: Version des im Wiedereröffnungsdialog geprüften Fallstands.
                operation:
