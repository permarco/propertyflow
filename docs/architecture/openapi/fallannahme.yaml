          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: Formulardaten fehlen oder sind ungültig, etwa die Fallversion.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/StaffWriteDenied'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '409':
          description: >
            Die Fallversion ist veraltet, der Fall ist nicht abgeschlossen
            oder die Aktion ist im aktuellen Prozessstand nicht zulässig.
            Dazu gehört auch dieselbe Absende-ID mit einer abweichenden
            Fallversion. Das UI lädt den aktuellen Fallstand.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '500':
          description: >
            Ein technischer Fehler oder Timeout verhindert die Bestätigung.
            Bei unklarem Ausgang kann der neue Status bereits gespeichert
            sein. Das UI lädt den gespeicherten Fallstand neu und behält die
            Absende-ID. PropertyFlow wiederholt den Auftrag nicht automatisch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall und Wiedereröffnung nach erneuter Zugriffsprüfung.
        rule: >
          Eine identische Wiederholung einer gespeicherten Wiedereröffnung
          bestätigt dasselbe Ereignis mit 200. Auch nach einem erneuten
          Abschluss löst sie keinen weiteren Statuswechsel aus. Wiederholte
          Aufrufe und Worker-Ausführungen erzeugen höchstens einen Nachweis
          der Wiedereröffnung. Dieselbe Absende-ID mit anderer Fallversion
          ergibt 409. Eine neue Wiedereröffnung erfordert einen abgeschlossenen
