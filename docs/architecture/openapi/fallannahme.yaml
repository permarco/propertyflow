      summary: Externe Fallnachricht veröffentlichen
      x-propertyflow-status: zielvertrag
      description: >
        Ein berechtigter Mitarbeiter sendet eine Information oder Rückfrage
        zu einem aktiven Fall. PropertyFlow prüft Eingabe, Absende-ID und die
        Prozessfreigabe für die Veröffentlichung. Camunda veranlasst die
        Veröffentlichung im zugeordneten Fallprozess. Der PropertyFlow-Worker
        speichert die externe Nachricht mit dem gewählten Antwortbedarf
        dauerhaft. Danach ist sie im berechtigten Mieter- und Mitarbeiterverlauf
        abrufbar. Der E-Mail-Versand folgt der Veröffentlichung. Die Pflicht
        zur Benachrichtigung bleibt über einen Neustart hinweg nachvollziehbar
        (UC-010, KOM-01, BEN-03).

        Bei erforderlicher Mieterantwort bestimmt Camunda den Folgestatus
        gemäss FALL-05. Bei laufender Wiedervorlage bleiben Termin und Status
        «Wartet auf Wiedervorlage» bestehen und die Rückfrage bleibt offen.
        Eine Informationsnachricht lässt frühere offene Rückfragen bestehen.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [text, operation, csrf]
              properties:
                text:
                  type: string
                  pattern: '\S'
                  description: Bei der Sendeaktion bestätigter externer Nachrichtentext.
                answer:
                  type: boolean
                  default: false
                  description: Bei true ist eine Mieterantwort erforderlich.
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
      responses:
        '200':
          description: >
            Die von Camunda veranlasste Nachricht ist dauerhaft gespeichert
            und für den berechtigten Mieter im Fallverlauf sichtbar.
            PropertyFlow prüft die Veröffentlichung anhand der Absende-ID.
            Die Antwort enthält keinen Körper. Das UI lädt den gespeicherten
            Verlauf neu. Der E-Mail-Versand folgt der Veröffentlichung. Die
