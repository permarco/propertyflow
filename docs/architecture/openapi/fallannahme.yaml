                  type: integer
                  format: int64
                  description: Version des im Abschlussdialog geprüften Fallstands.
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
      responses:
        '200':
          description: >
            Camunda hat den Abschluss veranlasst. PropertyFlow hat den
            Status «Abgeschlossen» und den zugehörigen Abschlussnachweis
