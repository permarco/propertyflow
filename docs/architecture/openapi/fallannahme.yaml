openapi: 3.1.1
info:
  title: PropertyFlow · HTTP-Vertrag
  version: '1.0.0'
  description: >
    HTTP-Vertrag für die Browserrouten von PropertyFlow. Die Operationen für
    Fallannahme, Mieternachrichten und ausgewählte Mitarbeiteraktionen
    beschreiben Zielabläufe mit dauerhafter Speicherung und Camunda. Mit
    frontend-demo gekennzeichnete Operationen beschreiben das Verhalten der
    lokalen Demo. Statische Ressourcen und technische Betriebsendpunkte sind
    gesondert zu betrachten.
tags:
  - name: Mieter
    description: Anliegen einreichen, eigene Fälle einsehen und Nachrichten senden.
  - name: Mitarbeitende
    description: Fälle bearbeiten, Nachrichten formulieren und Mitarbeiterkonten anlegen.
  - name: Anmeldung/Abmeldung
    description: Mieterkonto registrieren und sich per E-Mail-Einmalcode anmelden oder abmelden.
paths:
  /:
    get:
      operationId: demoStartseiteOeffnen
      summary: Startseite der Demo öffnen
      x-propertyflow-status: frontend-demo
      responses:
        '200':
          $ref: '#/components/responses/HtmlAnsicht'
  /demo/datenschutz:
    get:
      operationId: demoDatenschutzOeffnen
      summary: Datenschutzinformationen zur lokalen Demo öffnen
      x-propertyflow-status: frontend-demo
      responses:
        '200':
          $ref: '#/components/responses/HtmlAnsicht'
  /mieter/fall:
    get:
      operationId: mieterformularOeffnen
      tags: [Mieter]
      summary: Formular für ein neues Anliegen öffnen
      description: >
        Das Formular enthält eine Absende-ID und einen CSRF-Token für die
        Browsersitzung. Gäste geben ihre Kontaktadresse ein. Bei einem
        verifizierten Mieterkonto übernimmt der Dienst die Konto-Adresse
        beim Absenden. Der Aufruf erzeugt keinen Fall und lädt keine
        bestehenden Falldaten.
      responses:
        '200':
          $ref: '#/components/responses/HtmlAnsicht'
    post:
      operationId: mieteranliegenEinreichen
      tags: [Mieter]
      summary: Neues Mieteranliegen einreichen (Login freiwillig)
      description: >
        Die Einreichung ist öffentlich. Der Browser lädt zuerst das Formular
        über GET /mieter/fall und sendet dessen CSRF-Token und Absende-ID mit
        dem Sitzungscookie zurück. Bei einem angemeldeten, verifizierten
        Mieterkonto stammt die Kontaktadresse aus dem serverseitig geprüften
        Konto. Eine mitgesendete Adresse kann sie nicht überschreiben.
        PropertyFlow speichert den Fall mit Status «Eingegangen» und dem
        Prozessstartauftrag in derselben Transaktion. Nach bestätigtem Commit
        öffnet der Browser die persönliche Fallansicht per GET. Camunda, das
        KI-Modell und der Mailversand laufen nachgelagert.
      security: []
      parameters:
        - in: cookie
          name: JSESSIONID
          required: true
          description: >
            Sitzungscookie, das der Browser beim öffentlichen Formularaufruf
            erhält und für die Prüfung des CSRF-Tokens mitsendet.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [title, unit, description, csrf, operation]
              properties:
                title:
                  type: string
                  minLength: 1
                  x-propertyflow-max-utf16-code-units: 150
                  description: Betreff mit Inhalt und höchstens 150 UTF-16-Codeeinheiten.
                unit:
                  type: string
                  minLength: 1
                  x-propertyflow-max-utf16-code-units: 200
                  description: Objekt- oder Wohnungsreferenz mit Inhalt und höchstens 200 UTF-16-Codeeinheiten.
                description:
                  type: string
                  minLength: 1
                  x-propertyflow-max-utf16-code-units: 2000
                  description: >
                    Beschreibung mit Inhalt. Der Server wandelt CRLF und CR in
                    LF um und prüft höchstens 2’000 UTF-16-Codeeinheiten vor dem
                    Entfernen äusserer Leerzeichen.
                email:
                  type: string
                  description: >
                    Ohne verifiziertes Mieterkonto erforderlich. Die
                    Kontaktadresse wird serverseitig gemäss ZUG-04 geprüft und
                    vereinheitlicht. Die geprüfte Adresse hat höchstens 254
                    ASCII-Zeichen.
                accountSubmission:
                  type: boolean
                  default: false
                  description: >
                    Kennzeichnet ein aus dem angemeldeten Mieterkonto
                    abgesendetes Formular. Der Server prüft das Konto anhand
                    der Sitzung.
                csrf:
                  type: string
                  minLength: 1
                  description: CSRF-Token aus dem Formular, an die Browsersitzung gebunden.
                operation:
                  type: string
                  minLength: 1
                  x-propertyflow-max-utf16-code-units: 80
                  description: Absende-ID aus dem Formular mit höchstens 80 UTF-16-Codeeinheiten.
      responses:
        '303':
          description: >
            Der Fall und sein Startauftrag sind dauerhaft gespeichert. Der
            Browser öffnet die persönliche Fallansicht aus Location mit GET.
            Dort erscheint die Case-ID. Das gilt auch für eine zulässige
            identische Wiederholung.
          headers:
            Location:
              $ref: '#/components/headers/PersonalCaseLocation'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: >
            Ein Formularfeld fehlt oder ist ungültig, etwa die Gastadresse,
            die Absende-ID oder eine zu lange Beschreibung. Das Formular
            zeigt die Eingaben mit einem Fehlerhinweis erneut.
          content:
            text/html:
              schema:
                type: string
        '401':
          description: >
            Das Kontoformular wurde ohne gültige Anmeldung als verifizierter
            Mieter gesendet. Das Formular zeigt einen Hinweis zur Anmeldung.
          content:
            text/html:
              schema:
                type: string
        '403':
          description: >
            Die Browsersitzung oder der zugehörige CSRF-Nachweis fehlt oder
            ist ungültig.
          content:
            text/html:
              schema:
                type: string
        '409':
          description: >
            Dieselbe Absende-ID wurde im gleichen Einreichungskontext bereits
            mit anderem Inhalt gespeichert. Das Formular zeigt den Konflikt.
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Das Rate Limit für die Fallanlage ist erreicht.
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Unerwarteter serverseitiger Fehler. Die Antwort enthält einen neutralen Fehlerhinweis.
          content:
            text/html:
              schema:
                type: string
        '503':
          description: >
            Die dauerhafte Speicherung kann wegen einer vorübergehend nicht
            verfügbaren Datenbank nicht bestätigt werden. Die Antwort
            bestätigt keine Fallannahme.
          content:
            text/html:
              schema:
                type: string
      x-propertyflow-idempotency:
        key: operation
        scope: >
          Die serverseitig ermittelte Konto-ID bei einem angemeldeten
          Mieterkonto oder die ursprüngliche Browsersitzung bei Gästen.
        rule: >
          Bei gleichem Schlüssel und identischem Inhalt erhält der
          berechtigte Browser dieselbe Case-ID und bei weiterhin gültigem
          Fall-Link dieselbe Weiterleitung. Ein zweiter Fall oder
          Startauftrag entsteht nicht. Geänderter Inhalt im selben Kontext
          ergibt 409. Für den Vergleich gelten Betreff, Objekt- oder
          Wohnungsreferenz, die vom Server bestimmte Kontaktadresse und die
          Beschreibung nach Zeilenumbruchnormalisierung.
        persistence: >
          PropertyFlow speichert die Wiederholungszuordnung gemeinsam mit der
          Fallannahme. Bei einem Konto bleibt sie für die Aufbewahrungsdauer
          des Falls verfügbar. Gästen steht die Wiederholung während der
          Gültigkeit der ursprünglichen Browsersitzung offen. Eine Absende-ID
          allein gewährt weder Zugriff auf den Fall noch auf dessen Link.
          Ersetzte Fall-Links bleiben gesperrt.
        retry: >
          Nach Timeout, Verbindungsabbruch oder unklarer 5xx-Antwort sendet
          der Browser im gültigen Einreichungskontext denselben Inhalt mit
          derselben Absende-ID erneut.
      x-propertyflow-data-classification:
        input: Personenbezogene Falldaten, insbesondere Kontaktadresse, Wohnungsreferenz und Freitext.
        location: Vertrauliches Zugangsgeheimnis im Location-Header.
        limits: >
          Zugriff gemäss ZUG-04. Klartexttokens, Freitext und Kontaktadressen
          gehören nicht in technische Protokolle. Tokenpfade werden vor der
          Protokollierung unkenntlich gemacht. Fehler geben keine internen
          Details oder Zugangsdaten preis.
      x-propertyflow-service-objective:
        id: NFR-03
        metric: Anteil gültiger Neueinreichungen mit 303 und dauerhaft gespeichertem Fall samt genau einem Startauftrag.
        targetPercent: 100
        verification:
          durationMinutes: 10
          submissions: 20
          conditions: >
            PostgreSQL ist erreichbar. Camunda und das KI-Modell sind
            während des gesamten Tests unerreichbar. Über zehn Minuten
            reichen Gäste und verifizierte Mieter je zehn gültige Fälle ein.
          evidence: >
            Für jede Einreichung 303 und die Case-ID aus der verlinkten
            Fallansicht erfassen. PropertyFlow neu starten, während Camunda
            unerreichbar bleibt. Für jede bestätigte Case-ID genau einen Fall
            und einen offenen Startauftrag nachweisen. Sollwert 20 von 20.
  /mieter/fall/zugang/{token}:
    parameters:
      - $ref: '#/components/parameters/FallToken'
    get:
      operationId: persoenlicheFallansichtOeffnen
      tags: [Mieter]
      summary: Persönliche Fallansicht öffnen
      description: >
        PropertyFlow prüft den Token und ermittelt darüber genau einen Fall.
        Ein gültiger Link öffnet die Fallansicht direkt unter derselben URL.
        Ein Konto oder eine bestehende Browsersitzung ist dafür nicht
        erforderlich. Der Aufruf verbraucht den Token nicht und löst keine
        Falländerung aus.
      responses:
        '200':
          description: >
            HTML-Ansicht mit Case-ID, Bearbeitungsstatus, wirksamer
            Dringlichkeit und freigegebenem Verlauf. Bei «Eingegangen» oder
            «Abgeschlossen» bleibt die Ansicht lesend. Für die Nachrichteneingabe
            erhält der Browser bei zulässigem Schreiben einen CSRF-Token und
            eine Absende-ID.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/FallLinkNichtVerfuegbar'
        '429':
          $ref: '#/components/responses/FallzugriffRateLimit'
        '500':
          description: Die Fallansicht ist wegen eines technischen Fehlers nicht verfügbar.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                type: string
  /mieter/fall/zugang/{token}/nachrichten:
    parameters:
      - $ref: '#/components/parameters/FallToken'
    post:
      operationId: mieternachrichtSenden
      tags: [Mieter]
      summary: Ergänzung oder Antwort zum bestehenden Fall senden
      description: >
        PropertyFlow prüft den Fall-Link, den CSRF-Nachweis und die Eingabe.
        Vor der Speicherung einer neuen Nachricht prüft es, ob der Fall
        aktiv ist, der zugeordnete Fallprozess läuft und Camunda erreichbar
        ist. Danach speichert es die Nachricht als externen Mietereintrag.
        Nach dem Datenbank-Commit übergibt es die gespeicherte Nachrichten-ID
        synchron an die zugeordnete Camunda-Prozessinstanz. Die
        Erfolgsmeldung setzt eine bestätigte Korrelation mit dieser Instanz
        voraus. Neubewertung, weitere Statusänderungen und E-Mail folgen
        nachgelagert.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MieternachrichtFormular'
      responses:
        '303':
          description: >
            Die Nachricht ist gespeichert und die Korrelation mit der
            zugeordneten Camunda-Prozessinstanz ist bestätigt. Location
            verweist auf dieselbe persönliche Fallansicht ohne den Pfadteil
            /nachrichten. Eine bereits bestätigte identische Wiederholung
            gibt dieselbe Weiterleitung zurück.
          headers:
            Location:
              $ref: '#/components/headers/PersonalCaseLocation'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          $ref: '#/components/responses/MieternachrichtUngueltig'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '404':
          $ref: '#/components/responses/FallLinkNichtVerfuegbar'
        '409':
          $ref: '#/components/responses/MieternachrichtKonflikt'
        '429':
          $ref: '#/components/responses/FallzugriffRateLimit'
        '500':
          $ref: '#/components/responses/MieternachrichtFehler'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall und externe Mieternachricht nach erneuter Zugriffsprüfung.
        rule: >
          Gleiche Absende-ID und gleicher Text nach Zeilenumbruchnormalisierung
          ergeben höchstens einen Verlaufseintrag, auch bei einem Wechsel
          zwischen Fall-Link und Kontozugang. Ist die Korrelation bereits
          bestätigt, liefert eine zulässige identische Wiederholung auch nach
          Fallabschluss 303. Ein abweichender Text bei einer bereits
          gespeicherten Nachricht mit derselben Absende-ID ergibt 409.
        retry: >
          Nach einem unklaren Ausgang sendet der Mieter denselben Text mit
          derselben Absende-ID. PropertyFlow verwendet die gegebenenfalls
          bereits gespeicherte Nachricht und antwortet mit 303 erst nach
          bestätigter Korrelation.
  /anmelden:
    get:
      operationId: anmeldeformularOeffnen
      tags: [Anmeldung/Abmeldung]
      summary: Anmeldung für Mieter und Mitarbeitende öffnen
      description: Öffnet das Formular für den E-Mail-Einmalcode und stellt einen CSRF-Token in der Browsersitzung bereit.
      responses:
        '200':
          description: HTML-Anmeldeformular.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
  /anmelden/code:
    post:
      operationId: anmeldecodeAnfordern
      tags: [Anmeldung/Abmeldung]
      summary: Einmalcode zur Anmeldung anfordern
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf]
              properties:
                csrf:
                  type: string
                  minLength: 1
                  description: CSRF-Token aus dem Formular in derselben Browsersitzung.
                email:
                  type: string
                  description: >
                    E-Mail-Adresse des Kontos. Bei der ersten Anforderung
                    ist eine gültige Adresse erforderlich. Beim erneuten
                    Anfordern kann der Browser die Adresse weglassen.
                    PropertyFlow verwendet dann die zuvor in derselben
                    Sitzung hinterlegte Adresse.
      responses:
        '200':
          description: >
            HTML-Formular für die Codeprüfung mit neutralem Hinweis. Die
            Antwort legt weder den Kontostatus noch das Versandergebnis offen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '400':
          description: Die E-Mail-Adresse fehlt oder ist ungültig. Das HTML-Formular zeigt den Eingabehinweis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '429':
          description: Das Anforderungslimit wurde erreicht. Das HTML-Formular zeigt einen Wartehinweis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
  /anmelden/pruefen:
    post:
      operationId: anmeldecodePruefen
      tags: [Anmeldung/Abmeldung]
      summary: Einmalcode prüfen und anmelden
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf, code]
              properties:
                csrf:
                  type: string
                  minLength: 1
                  description: CSRF-Token aus dem Formular in derselben Browsersitzung.
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Sechsstelliger Einmalcode zur zuvor in derselben Sitzung angeforderten Anmeldung.
      responses:
        '303':
          description: >
            Anmeldung erfolgreich. PropertyFlow verbraucht den Code, wechselt
            die Sitzungskennung und erneuert den CSRF-Token. Mieter gelangen
            zu /mieter/faelle. Mitarbeitende gelangen zu einem zuvor
            gespeicherten, zulässigen Ziel im Mitarbeiterbereich oder zur
            Übersicht /mitarbeiter/faelle.
          headers:
            Location:
              $ref: '#/components/headers/BrowserLocation'
            Set-Cookie:
              required: true
              description: Sitzungscookie mit erneuerter Sitzungskennung.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: >
            Keine gültige Codeanforderung in der Sitzung oder Code ungültig,
            abgelaufen oder bereits verbraucht. Das HTML-Formular meldet den
            Fehler ohne Kontoinformationen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
  /registrieren:
    get:
      operationId: registrierungsformularOeffnen
      tags: [Anmeldung/Abmeldung]
      summary: Formular für ein freiwilliges Mieterkonto öffnen
      description: Öffnet die Registrierung per E-Mail-Einmalcode und stellt einen CSRF-Token in der Browsersitzung bereit.
      responses:
        '200':
          description: HTML-Registrierungsformular.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
  /registrieren/code:
    post:
      operationId: registrierungscodeAnfordern
      tags: [Anmeldung/Abmeldung]
      summary: Einmalcode zur Verifikation der E-Mail-Adresse anfordern
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf]
              properties:
                csrf:
                  type: string
                  minLength: 1
                  description: CSRF-Token aus dem Formular in derselben Browsersitzung.
                email:
                  type: string
                  description: >
                    E-Mail-Adresse für die Verifikation. Bei der ersten
                    Anforderung ist eine gültige Adresse erforderlich. Beim
                    erneuten Anfordern ohne Adresse verwendet PropertyFlow
                    die zuvor in derselben Sitzung hinterlegte Adresse.
      responses:
        '200':
          description: >
            HTML-Formular für die Codeprüfung mit neutralem Hinweis. Die
            Antwort legt weder den Kontostatus noch das Versandergebnis offen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '400':
          description: Die E-Mail-Adresse fehlt oder ist ungültig. Das HTML-Formular zeigt den Eingabehinweis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
        '429':
          description: Das gemeinsame Anforderungslimit für Registrierung und Anmeldung wurde erreicht.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
  /registrieren/pruefen:
    post:
      operationId: registrierungscodePruefen
      tags: [Anmeldung/Abmeldung]
      summary: E-Mail-Adresse verifizieren und Mieterkonto öffnen
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf, code]
              properties:
                csrf:
                  type: string
                  minLength: 1
                  description: CSRF-Token aus dem Formular in derselben Browsersitzung.
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Sechsstelliger Einmalcode zur zuvor in derselben Sitzung angeforderten Registrierung.
      responses:
        '303':
          description: >
            E-Mail-Adresse erfolgreich verifiziert. PropertyFlow aktiviert
            ein neues Mieterkonto oder öffnet ein bestehendes Mieterkonto.
            PropertyFlow verbraucht den Code, wechselt die Sitzungskennung
            und erneuert den CSRF-Token. Dieser Zielablauf führt zu
            /mieter/faelle. Die lokale Demo leitet bei der E-Mail-Adresse
            eines bestehenden Mitarbeiterkontos in den Mitarbeiterbereich.
          headers:
            Location:
              $ref: '#/components/headers/BrowserLocation'
            Set-Cookie:
              required: true
              description: Sitzungscookie mit erneuerter Sitzungskennung.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: >
            Keine gültige Codeanforderung in der Sitzung oder Code ungültig,
            abgelaufen oder bereits verbraucht. Das HTML-Formular meldet den
            Fehler ohne Kontoinformationen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '403':
          $ref: '#/components/responses/InvalidCsrf'
  /abmelden:
    post:
      operationId: webSitzungBeenden
      tags: [Anmeldung/Abmeldung]
      summary: Web-Sitzung beenden
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf]
              properties:
                csrf:
                  type: string
                  minLength: 1
                  description: CSRF-Token aus der aktuellen Browsersitzung.
      responses:
        '303':
          description: PropertyFlow hat die Browsersitzung beendet und leitet auf /mieter/fall weiter.
          headers:
            Location:
