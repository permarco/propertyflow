          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: >
            Die Formulareingabe ist ungültig, etwa weil der Nachrichtentext
