  /mieter/faelle/{id}/nachrichten:
    parameters:
      - name: id
        in: path
        required: true
        description: Case-ID des Falls. Der Server prüft die Zuordnung zum Mieterkonto.
        schema:
          type: string
          minLength: 1
    post:
      operationId: mieternachrichtImKontoSenden
      tags: [Mieter]
      summary: Ergänzung oder Antwort aus dem Mieterkonto senden
      description: >
        PropertyFlow prüft die Anmeldung, die Fallzuordnung anhand der
        verifizierten Konto-Adresse, den CSRF-Nachweis und die Eingaben. Vor
        dem Speichern einer neuen Nachricht prüft es den aktiven Fall,
        den laufenden Fallprozess und die Erreichbarkeit von Camunda.
        Die Nachricht wird als externer Mietereintrag gespeichert. Nach dem
        Commit übergibt PropertyFlow die Nachrichten-ID synchron an die
        zugeordnete Camunda-Prozessinstanz. Die Erfolgsmeldung setzt die
        bestätigte Korrelation voraus.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MieternachrichtFormular'
      responses:
        '303':
          description: >
            Die Speicherung der Nachricht und ihre Korrelation mit der
            zugeordneten Camunda-Prozessinstanz sind bestätigt. Location
            verweist auf /mieter/faelle/{id} zum selben Fall. Dies gilt
            auch für eine bereits bestätigte identische Wiederholung.
          headers:
            Location:
              $ref: '#/components/headers/BrowserLocation'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          $ref: '#/components/responses/MieternachrichtUngueltig'
        '401':
          description: Die Anmeldung fehlt oder ist abgelaufen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '403':
          description: Die Rolle des Kontos erlaubt die Aktion nicht oder der CSRF-Nachweis ist ungültig.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '409':
          $ref: '#/components/responses/MieternachrichtKonflikt'
        '429':
          $ref: '#/components/responses/FallzugriffRateLimit'
        '500':
          $ref: '#/components/responses/MieternachrichtFehler'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall und externe Mieternachricht nach erneuter Zugriffsprüfung.
        rule: >
          Gleiche Absende-ID und gleicher Text nach Zeilenumbruchnormalisierung
          ergeben höchstens einen Verlaufseintrag, auch bei einem Wechsel
          zwischen Kontozugang und Fall-Link. Ist die Korrelation bestätigt,
          liefert eine zulässige identische Wiederholung 303, auch nach
          Fallabschluss. Geänderter Text mit derselben bereits gespeicherten
          Absende-ID ergibt 409.
        retry: >
          Bei unklarem Ausgang denselben Text und dieselbe Absende-ID
          erneut senden. PropertyFlow verwendet die bereits gespeicherte
          Nachricht, falls vorhanden. 303 setzt bestätigte Korrelation voraus.
  /mitarbeiter/faelle:
    get:
      operationId: mitarbeiterFalluebersichtOeffnen
      tags: [Mitarbeitende]
      summary: Geschützte Fallübersicht öffnen oder aktualisieren
      description: >
        Ein persönlich angemeldeter Mitarbeiter mit aktiver Mitarbeiterrolle
        erhält die Fälle und Trefferzahl gemäss seiner Fallberechtigung.
        Die Route dient auch dem Nachladen derselben HTML-Ansicht. Ohne
        gültige Sitzung führt eine Seitennavigation zur Anmeldung. Ein
        Hintergrundabruf erhält 401.
      security:
        - BrowserSession: []
      parameters:
        - in: header
          name: X-PropertyFlow-Request
          description: Kennzeichnet einen Hintergrundabruf der Browseroberfläche.
          schema:
            type: string
            const: partial
        - in: query
          name: q
          description: Suchtext mit höchstens 200 UTF-16-Codeeinheiten.
          schema:
            type: string
            x-propertyflow-max-utf16-code-units: 200
            default: ''
        - in: query
          name: urgency
          description: Filter nach wirksamer Dringlichkeit. Leer bedeutet alle Stufen.
          schema:
            type: string
            enum: ['', Noch nicht bewertet, Kritisch, Hoch, Normal, Niedrig]
            default: ''
        - in: query
          name: closed
          description: Bei true zusätzlich abgeschlossene Fälle anzeigen.
          schema:
            type: boolean
            default: false
        - in: query
          name: sort
          description: Sortierspalte. Die Standardsortierung verwendet Dringlichkeit und letzte Mieteraktion.
          schema:
            type: string
            enum: [default, title, unit, received, contact, followUp, urgency, status]
