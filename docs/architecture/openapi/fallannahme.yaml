      tags: [Mitarbeitende]
      summary: Fall abschliessen
      x-propertyflow-status: zielvertrag
      description: >
        Das UI sendet den Auftrag nach ausdrücklicher Bestätigung im
        Abschlussdialog. PropertyFlow prüft die Mitarbeiterberechtigung, die
        angezeigte Fallversion, die Abschlussvoraussetzungen und die Freigabe
        im laufenden Fallprozess (UC-014, FALL-07, FALL-10). PropertyFlow
        übergibt den Auftrag synchron an die zugeordnete Camunda-Instanz.
        Camunda veranlasst den Abschluss und beendet den Timer einer offenen
        Wiedervorlage. Ein überholter Timer darf den Fall nicht wiedereröffnen.

        Der Worker speichert den Status «Abgeschlossen» gemeinsam mit
        dem Abschlussnachweis, entfernt einen offenen Wiedervorlagetermin
        und beendet noch offenen Mieterantwortbedarf (FALL-11, KOM-04).
        PropertyFlow speichert intern den handelnden Mitarbeiter aus der
        geprüften Sitzung, den Zeitpunkt, die Quelle «Mitarbeiter» und den
        Vermerk «Vom Mitarbeiter geprüft: keine weitere Bearbeitung erforderlich.»
        Mit dem Abschluss greift die Schreibsperre für neue Nachrichten und
        Memos. Berechtigte Personen können den Fall weiterhin lesen, auch über
        einen gültigen persönlichen Fall-Link.

        Nach der dauerhaften Speicherung folgt die Abschluss-E-Mail gemäss
        BEN-05. Pro Abschluss entsteht ein logischer Abschlussmailauftrag.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [version, operation, csrf]
              properties:
