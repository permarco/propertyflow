      summary: Fallaktion über das Demoformular ausführen
      x-propertyflow-status: frontend-demo
      description: >
        Dieser Formularvertrag beschreibt die lokale Demo. Die dortige
        direkte Statusauswahl gehört zur Demo. Im Zielablauf steuert Camunda
        die Statuswechsel. Für «Bearbeitung fortsetzen» gilt der eigene
        Vertrag POST /mitarbeiter/faelle/{id}/bearbeitung-fortsetzen.
        Für die Wiedervorlage gilt POST /mitarbeiter/faelle/{id}/wiedervorlage.
        Für den Mitarbeiterabschluss gilt POST /mitarbeiter/faelle/{id}/abschliessen.
        Für die Wiedereröffnung gilt POST /mitarbeiter/faelle/{id}/wiedereroeffnen.
        Zum Aufheben des Antwortbedarfs dient im Zielablauf
        POST /mitarbeiter/faelle/{id}/nachrichten/{messageId}/antwortbedarf-aufheben.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [action, version, operation, csrf]
              properties:
                action:
                  type: string
                  enum: [urgency, status, followUp, clearFollowUp, unit, close, reopen, clearAnswer]
                  description: Ausgewählte Demoaktion.
                version:
                  type: integer
                  format: int64
                  description: Version des bei der Erfassung angezeigten Fallstands.
                value:
                  type: string
                  description: Aktionsabhängiger Wert, etwa Dringlichkeit, Zuordnung, Datum oder Nachrichten-ID.
                days:
                  oneOf:
