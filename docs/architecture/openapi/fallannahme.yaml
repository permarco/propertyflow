          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '500':
          description: >
            Ein technischer Fehler oder Timeout verhindert die Bestätigung
            der Veröffentlichung. Bei unklarem Ausgang kann sie bereits
            gespeichert sein. Text, Antwortbedarf und Absende-ID bleiben im
            Formular. Das UI lädt den gespeicherten Verlauf neu. Eine
            Wiederholung verwendet dieselbe Absende-ID und löst keine zweite
            Veröffentlichung aus.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall und Mitarbeiterkommunikation nach erneuter Zugriffsprüfung.
