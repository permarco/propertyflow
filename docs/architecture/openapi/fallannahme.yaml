            den gespeicherten Fallstand neu und behält die Nachrichteneingabe,
            ihre Auswahl und den laufenden KI-Stream.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: Formulardaten fehlen oder sind ungültig, etwa die Fallversion.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/StaffWriteDenied'
        '404':
          description: >
            Der Fall oder die Rückfrage ist nicht verfügbar. Eine unbekannte
            Nachrichten-ID und eine Nachrichten-ID aus einem anderen Fall
            ergeben dieselbe Antwort ohne Fall- oder Nachrichtendaten.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '409':
          description: >
            Die Fallversion ist veraltet, der Fall ist nicht aktiv, die
            Nachricht hat keinen offenen Antwortbedarf oder der Fallprozess
            erlaubt die Aktion aktuell nicht. Dieselbe Absende-ID mit einer
            anderen Nachrichten-ID oder Fallversion ergibt ebenfalls 409.
            Das UI lädt den aktuellen Fallstand.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '500':
          description: >
            Ein technischer Fehler oder Timeout verhindert die Bestätigung.
            Bei unklarem Ausgang kann die Aufhebung bereits gespeichert sein.
            Das UI lädt den gespeicherten Fallstand neu und behält die
            Absende-ID. PropertyFlow wiederholt den Auftrag nicht automatisch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall und manuelle Aufhebung des Antwortbedarfs nach erneuter Zugriffsprüfung.
        rule: >
          Eine identische Wiederholung einer gespeicherten Aufhebung bestätigt
          dasselbe Ereignis mit 200. Dieselbe Absende-ID ist an die gewählte
          Nachrichten-ID und die ursprüngliche Fallversion gebunden.
          Wiederholte Aufrufe oder Worker-Ausführungen erzeugen höchstens
          einen Beendigungsvermerk und keinen zusätzlichen Statuswechsel.
  /mitarbeiter/faelle/{id}/ki-formulierung:
    parameters:
      - $ref: '#/components/parameters/StaffCaseId'
    post:
      operationId: mitarbeiterKiFormulierungStarten
      tags: [Mitarbeitende]
      summary: KI-Formulierung starten und streamen
      x-propertyflow-status: zielvertrag
      description: >
        Ein berechtigter Mitarbeiter startet aus der aktiven Fallansicht
        einen Vorschlag für eine externe Nachricht. PropertyFlow prüft
        Mitarbeitersitzung, Fallberechtigung, CSRF, Eingabe und ob der Fall
        aktiv ist. Die Oberfläche startet pro Fallansicht höchstens einen
        Versuch gleichzeitig und sperrt den Start während einer Nachrichten-
        oder Memo-Speicherung. Der Browser erzeugt vor dem Start eine
        attemptId und kann damit bereits beim Warten auf das erste Stück
        abbrechen. PropertyFlow bindet die attemptId an Fall und Sitzung.
        Ein erneuter Start mit derselben ID löst keinen zweiten Modellaufruf aus.

        Der Versuch verwendet die beim Start übermittelte Sachanweisung und
        den serverseitig freigegebenen Kommunikationskontext gemäss KOM-02.
        Mitarbeitermemos, Systemmemos, interne Änderungsbegründungen und
        daraus abgeleitete Inhalte bleiben aus dem Modellkontext. Nachträgliche
        Eingabe- oder Statusänderungen beenden den laufenden Versuch nicht
        und ändern seinen Kontext nicht. Der Vorschlag ist ungespeicherter
        Text. Die Oberfläche zeigt ihn als Text an und bietet die bewusste
        Übernahme erst nach vollständiger Ausgabe an. Senden und Veröffentlichen
        sind eine separate Aktion gemäss UC-010. Die Formulierung ändert weder
        den Fallstatus noch den Camunda-Fallprozess (UC-004, ADR-003).
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [text, attemptId, csrf]
              properties:
                text:
                  type: string
                  pattern: '\S'
                  description: Bewusst eingegebene kurze Sachanweisung für die externe Nachricht.
                attemptId:
                  $ref: '#/components/schemas/StaffFormulationAttemptId'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
                internal:
                  type: boolean
                  const: false
                  default: false
                  description: Start nur für die externe Auswahl, also bei ausgeschaltetem «Intern».
      responses:
        '200':
          description: |
            Der Browser startet den Formular-POST mit `fetch` und liest
            den Antwortkörper fortlaufend als UTF-8-Server-Sent Events.
            Jedes Ereignis hat eine `event`-Zeile und JSON in `data`.

            | Ereignis | Daten und Bedeutung |
            | --- | --- |
            | `delta` | `{"text":"…"}` enthält das nächste anzuhängende Textstück. |
            | `complete` | `{}` bestätigt den vollständigen Vorschlag. |
            | `error` | `{"code":"formulierung-fehlgeschlagen"}` meldet einen Fehler nach Beginn der HTTP-Antwort. |
            | `aborted` | `{}` beendet den Stream nach wirksamem Abbruch, sofern der Stream noch verbunden ist. |

            `complete`, `error` und `aborted` sind abschliessend. Der Stream
            endet danach. Ein Ende ohne Abschlussereignis gilt als Fehler,
            sofern der Browser den Versuch nicht selbst abgebrochen hat.
            Die Oberfläche verbindet sich nicht automatisch neu. Nach Fehler
            oder Abbruch bleibt die Mitarbeitereingabe erhalten. Verspätete
            Stücke eines abgebrochenen Versuchs werden verworfen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: delta
                data: {"text":"Guten Tag,\n\n"}

                event: delta
                data: {"text":"wir haben den Techniker aufgeboten."}

                event: complete
                data: {}

        '400':
          description: >
            Das Formular ist ungültig, etwa bei leerem Text, ungültiger
            Versuchs-ID oder interner Auswahl. Es wird kein Modellaufruf gestartet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/StaffWriteDenied'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '409':
          description: >
            Der Fall ist nicht aktiv oder die Versuchs-ID wurde bereits
            gestartet oder abgebrochen. Ein neuer Versuch erhält eine neue ID.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '500':
          description: >
            Technischer Fehler oder Timeout vor Beginn der Stream-Antwort.
            Die Mitarbeitereingabe bleibt erhalten.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
  /mitarbeiter/faelle/{id}/ki-formulierung/{attemptId}/abbrechen:
    parameters:
      - $ref: '#/components/parameters/StaffCaseId'
      - in: path
        name: attemptId
        required: true
        description: ID des beim Start adressierten Formulierungsversuchs.
        schema:
          $ref: '#/components/schemas/StaffFormulationAttemptId'
    post:
      operationId: mitarbeiterKiFormulierungAbbrechen
      tags: [Mitarbeitende]
      summary: Laufende KI-Formulierung abbrechen
      x-propertyflow-status: zielvertrag
      description: >
        PropertyFlow prüft Mitarbeitersitzung, Fallberechtigung und CSRF.
        Der Abbruch betrifft genau die attemptId im adressierten Fall und
        in dieser Sitzung. PropertyFlow beendet die Verarbeitung dieses
        Versuchs und gibt die Abbruchanforderung an den Modelladapter weiter.
        Der Browser verwirft verspätete Textstücke. Die Mitarbeitereingabe
        bleibt erhalten. Der Abbruch ändert weder Fallstatus noch den
        Camunda-Fallprozess.

        Trifft der Abbruch vor dem zugehörigen Start ein, merkt PropertyFlow
        ihn während der Sitzung für dieselbe Fall- und Versuchs-ID vor. Der
        zugehörige Start weist die ID mit 409 ab. Versuche in anderen
        Sitzungen oder Fällen sind davon unberührt. Für die Steuerung werden
        nur vorübergehende technische Zustände geführt. Eingabe und Vorschlag
        werden nicht als Entwurf gespeichert.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf]
              properties:
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
      responses:
        '204':
          description: >
            Der Versuch ist beendet oder der Abbruch ist für den noch nicht
            eingetroffenen Start vorgemerkt. Erneutes Abbrechen ist zulässig.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: Die Versuchs-ID oder das Formular hat ein ungültiges Format.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/StaffWriteDenied'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '500':
          description: >
            Der Abbruch kann technisch nicht bestätigt werden. Der Browser
            zeigt keine weiteren Textstücke dieses Versuchs an und kann die
            Abbruchanforderung mit derselben ID wiederholen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
  /mitarbeiter/konten:
    post:
      operationId: mitarbeiterKontoAnlegen
      tags: [Mitarbeitende]
      summary: Mitarbeiterkonto anlegen
      x-propertyflow-status: zielvertrag
      x-propertyflow-required-permission: Mitarbeiterkonten verwalten
      description: >
        PropertyFlow prüft bei jedem Aufruf die aktive Mitarbeitersitzung,
        das aktuelle Zusatzrecht «Mitarbeiterkonten verwalten» und den
        CSRF-Nachweis. Das Formular enthält Name und geschäftliche
        E-Mail-Adresse. Der Dienst vergibt serverseitig eine stabile
        Benutzer-ID und die Mitarbeiterrolle. Die Kontoanlage vergibt kein
        Kontoverwaltungsrecht. Konto und Audit werden gemeinsam dauerhaft
        gespeichert. Das Audit enthält die anlegende Person, den Zeitpunkt,
        die angelegte Benutzer-ID und die vergebene Rolle (UC-007, ZUG-04).

        Die neue Person meldet sich anschliessend gemäss UC-006 per
        E-Mail-Einmalcode an. Das erste Verwaltungskonto mit dem Zusatzrecht
        wird bei der Ersteinrichtung einmalig per Serverbefehl angelegt.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, csrf]
              properties:
                name:
                  type: string
                  pattern: '\S'
                  description: Name der Person, für die das Konto bestimmt ist.
                email:
                  type: string
                  pattern: '\S'
                  description: >
                    Geschäftliche E-Mail-Adresse. PropertyFlow prüft und
                    vereinheitlicht sie gemäss der gemeinsamen E-Mail-Regel
                    in ZUG-04. Die geprüfte Adresse hat höchstens 254
                    ASCII-Zeichen.
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
      responses:
        '200':
          description: >
            Das Mitarbeiterkonto und sein Audit-Eintrag sind dauerhaft
            gespeichert. Die Antwort zeigt die bestätigte Anlage in der
            geschützten Kontoverwaltung.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '400':
          description: Name oder E-Mail-Adresse fehlt oder ist ungültig, oder das Formular enthält zusätzliche Felder.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          description: >
            Die Sitzung gewährt keine aktive Mitarbeiterrolle oder kein
            Zusatzrecht «Mitarbeiterkonten verwalten», oder der CSRF-Nachweis
            fehlt oder ist ungültig.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '409':
          description: >
            Die vereinheitlichte E-Mail-Adresse ist bereits einem Konto
            zugeordnet, auch bei einem bestehenden Mieterkonto. Ein erneuter
            oder paralleler Aufruf erzeugt kein zweites Konto. Der Dienst
            gibt keine bestehenden Kontodaten aus und ändert keine Rolle.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '500':
          description: >
            Die Anlage kann wegen eines technischen Fehlers nicht bestätigt
            werden. Bei verloren gegangener Bestätigung verhindert die
            Eindeutigkeitsprüfung eine doppelte Kontoanlage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
