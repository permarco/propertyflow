                reason:
                  type: string
                  x-propertyflow-max-utf16-code-units: 1000
                  description: Optionale interne Begründung mit höchstens 1’000 UTF-16-Codeeinheiten.
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
                returnTo:
                  $ref: '#/components/schemas/StaffReturnTo'
      responses:
        '303':
          $ref: '#/components/responses/StaffDetailRedirect'
        '400':
          description: Die Aktion oder ein Formularfeld ist ungültig.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/StaffWriteDenied'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '409':
          description: >
            Fallstand oder Aktion ist überholt, der Fallzustand erlaubt die
            Änderung nicht mehr oder die Absende-ID wurde bereits mit
            anderen Aktionsdaten verwendet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
  /mitarbeiter/faelle/{id}/bearbeitung-fortsetzen:
    parameters:
      - $ref: '#/components/parameters/StaffCaseId'
    post:
      operationId: mitarbeiterBearbeitungFortsetzen
      tags: [Mitarbeitende]
      summary: Bearbeitung nach Mitarbeiterprüfung fortsetzen
      x-propertyflow-status: zielvertrag
      description: >
        Bei «Mitarbeiterprüfung erforderlich» prüft PropertyFlow die
        Berechtigung für Fall und Aktion, die angezeigte Fallversion und die
        Zugehörigkeit der offenen Aufgabe zur serverseitig ermittelten
        Fallprozessinstanz (processInstanceKey). Es schliesst synchron genau
        die adressierte User Task über Camunda POST
        /v2/user-tasks/{userTaskKey}/completion ab. Eine neu geöffnete Aufgabe
        bleibt von einem Aufruf für die alte Aufgabe unberührt. Camunda
        steuert den Folgeschritt. Die optionale Begründung gehört zum
        internen Änderungsnachweis der bestätigten Aktion (UC-012, SS-003).
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [userTaskKey, version, csrf]
              properties:
                userTaskKey:
                  type: string
                  pattern: '^[0-9]+$'
                  description: Camunda-Schlüssel der im Formular angezeigten User Task als Dezimalzeichenfolge.
                version:
                  type: integer
                  format: int64
                  description: Version des bei der Bestätigung geprüften Fallstands.
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
                reason:
                  type: string
                  description: Optionale Begründung für den internen Änderungsnachweis.
      responses:
        '200':
          description: >
            Camunda hat den Abschluss dieser User Task mit 204 bestätigt.
            Die Antwort enthält keinen Körper. Das UI lädt das Falldetail
            neu. «In Bearbeitung» ist sichtbar, sobald der Worker den neuen
            Status gespeichert hat.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: >
            Die Eingabe ist ungültig, der Fallstand ist veraltet oder die
            Aktion oder User Task ist für diesen Fall nicht zulässig. Dazu
            zählen die Camunda-Antworten 404 und 409 beim Task-Abschluss.
            Das UI lädt den aktuellen Fallstand. Eine neu geöffnete Aufgabe
            bleibt offen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/StaffWriteDenied'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '500':
          description: >
            Ein technischer Fehler oder Timeout verhindert die Bestätigung.
            Bei einem Timeout kann Camunda die Aufgabe bereits abgeschlossen
            haben. Das UI lädt den gespeicherten Fallstand neu. PropertyFlow
            wiederholt den Abschluss nicht automatisch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
  /mitarbeiter/faelle/{id}/dringlichkeit-aendern:
    parameters:
      - $ref: '#/components/parameters/StaffCaseId'
    post:
      operationId: mitarbeiterDringlichkeitAendern
      tags: [Mitarbeitende]
      summary: Dringlichkeit eines Falls manuell einstufen
      x-propertyflow-status: zielvertrag
      description: >
        PropertyFlow prüft Berechtigung, Fallversion und ob der laufende
        Fallprozess die Aktion erlaubt. Es ordnet die fachliche Nachricht
        serverseitig der gespeicherten Prozessinstanz zu und wartet synchron
        auf Camundas Bestätigung der Korrelation (UC-012, SS-003). Der Worker
        speichert die manuelle Einstufung gemäss DRING-06. Die Speicherung
        muss gegen konkurrierende Änderungen und einen zwischenzeitlichen
        Fallabschluss abgesichert sein. Die manuelle Stufe hat Vorrang vor
        automatischen Bewertungen. Eine Begründung bleibt intern.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [urgency, version, operation, csrf]
              properties:
                urgency:
                  type: string
                  enum: [Kritisch, Hoch, Normal, Niedrig]
                  description: Gewählte fachliche Dringlichkeitsstufe.
                version:
                  type: integer
                  format: int64
                  description: Version des bei der Bestätigung geprüften Fallstands.
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
                reason:
                  type: string
                  description: Optionale Begründung für den internen Änderungsnachweis.
      responses:
        '200':
          description: >
            Camunda hat die Korrelation mit der zugeordneten Prozessinstanz
