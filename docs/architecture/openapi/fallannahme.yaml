        - in: query
          name: desc
          description: Sortierrichtung absteigend.
          schema:
            type: boolean
            default: false
        - in: query
          name: page
          description: >
            Gewünschte Seite mit bis zu 50 Fällen. Der Server begrenzt die
            Seitennummer auf den verfügbaren Bereich.
          schema:
            type: integer
            format: int32
            default: 1
      responses:
        '200':
          description: HTML-Fallübersicht mit berechtigten Treffern oder passender Leermeldung.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '303':
          $ref: '#/components/responses/StaffLoginRedirect'
        '400':
          description: Such-, Filter-, Sortier- oder Seiteneingabe ist ungültig.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '401':
          $ref: '#/components/responses/StaffReadNeedsLogin'
        '403':
          $ref: '#/components/responses/StaffReadDenied'
  /mitarbeiter/faelle/{id}:
