  /mitarbeiter/faelle/{id}/wiedervorlage:
    parameters:
      - $ref: '#/components/parameters/StaffCaseId'
    post:
      operationId: mitarbeiterWiedervorlageVerwalten
      tags: [Mitarbeitende]
      summary: Wiedervorlage verwalten
      x-propertyflow-status: zielvertrag
      description: >
        PropertyFlow prüft die Mitarbeiterberechtigung, den angezeigten
        Fallstand, die Eingabe und die Freigabe der Aktion im laufenden
        Fallprozess. Es übergibt die Aktion synchron an die zugeordnete
        Camunda-Instanz. Camunda führt den Timer im bestehenden Fallprozess.
        Setzen und Ändern führen zu «Wartet auf Wiedervorlage». Löschen
        beendet die Wartezeit und führt zu «In Bearbeitung». Der Worker
        speichert Termin, Status und internen Änderungsnachweis gemeinsam.
        Berücksichtigte Prüfgründe bleiben darin nachvollziehbar. Offene
        Mieterfragen bleiben bestehen (UC-013, FALL-11, SS-003).

        Verarbeitet Camunda während der Wartezeit eine neue Mieternachricht,
        hebt es die Wiedervorlage auf und veranlasst sofort die
        Mitarbeiterprüfung. Bei gleichzeitig fälligem Timer wird der Fall
        einmal zur Prüfung vorgelegt. Überholte Timer und wiederholte
        Ereignisse dürfen einen später gesetzten Termin nicht verändern.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [action, version, operation, csrf]
              properties:
                action:
                  type: string
                  enum: [set, change, delete]
                  description: Termin setzen, ändern oder löschen.
                date:
                  type: string
                  format: date
                  description: Gewähltes Kalenderdatum im Format JJJJ-MM-TT.
                days:
                  type: integer
                  minimum: 1
                  description: Positive Anzahl Tage bis zur Wiedervorlage.
                version:
                  type: integer
                  format: int64
                  description: Version des bei der Bestätigung geprüften Fallstands.
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
                reason:
                  type: string
                  description: Optionale Begründung für den internen Änderungsnachweis.
              oneOf:
                - properties:
                    action:
                      enum: [set, change]
                  oneOf:
                    - required: [date]
                    - required: [days]
                - properties:
                    action:
                      const: delete
                  not:
                    anyOf:
                      - required: [date]
                      - required: [days]
      responses:
        '200':
          description: >
            Camunda hat die Aktion zur Wiedervorlage bestätigt. Der daraus
            folgende Terminstand, Status und Änderungsnachweis sind dauerhaft
            gespeichert. Die Antwort enthält keinen Körper. Das UI lädt den
            gespeicherten Fallstand neu.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: >
            Die Eingabe ist ungültig, etwa weil beim Setzen oder Ändern Datum
            und Tageszahl zugleich angegeben sind oder ein zulässiger Termin
            fehlt. Die Eingabe bleibt im Formular.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/StaffWriteDenied'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '409':
          description: >
            Der Fallstand hat sich geändert, der Fallprozess ist noch nicht
            zugeordnet oder lässt die Aktion aktuell nicht zu. Das gilt auch
            beim Setzen mit bereits vorhandenem Termin, beim Ändern oder
            Löschen ohne aktuellen Termin oder beim Wiederverwenden der
            Absende-ID mit geänderten Aktionsdaten. Das UI lädt den aktuellen
            Fallstand. Nachrichteneingabe und KI-Stream bleiben erhalten.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '500':
          description: >
            Ein technischer Fehler oder Timeout verhindert die Bestätigung.
            Bei unklarem Ausgang kann die Aktion bereits wirksam sein. Das
            UI lädt den gespeicherten Fallstand neu und behält Eingabe und
            Absende-ID. PropertyFlow wiederholt die Aktion nicht automatisch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall und Aktionen zur Wiedervorlage nach erneuter Zugriffsprüfung.
        rule: >
          Eine identische Wiederholung einer bestätigten Aktion erhält erneut
          200. Aktion, ursprüngliche Terminangabe und Begründung werden bei
          jeder Wiederholung verglichen. Für eine relative Tagesangabe gilt
          weiterhin der beim ersten Auftrag ermittelte Termin. Mehrfache
          Verarbeitung erzeugt höchstens einen wirksamen Timer und einen
          Änderungsnachweis je Absende-ID. Geänderte Aktionsdaten mit
          derselben Absende-ID ergeben 409. Die Fallversion wird bei jeder
          neuen Aktion geprüft.
  /mitarbeiter/faelle/{id}/abschliessen:
