      tags: [Mitarbeitende]
      summary: Mitarbeiterzugriff entziehen
      x-propertyflow-status: zielvertrag
      x-propertyflow-required-permission: Mitarbeiterkonten verwalten
      description: >
        PropertyFlow prüft die aktive Mitarbeitersitzung, das aktuelle
        Zusatzrecht «Mitarbeiterkonten verwalten» und den CSRF-Nachweis.
        Die Verwaltung kann das adressierte Konto sperren oder dessen
        Mitarbeiterrolle entziehen. Die Kontosperre verhindert die Anmeldung
        mit diesem Konto. Der Rollenentzug belässt das Konto und entzieht
        den Mitarbeiterzugriff einschliesslich des darauf beruhenden
        Kontoverwaltungszugriffs (UC-029, ZUG-04).

        Kontostand oder Rolle und Audit-Eintrag werden gemeinsam dauerhaft
        gespeichert. Das Audit enthält die handelnde und die betroffene
        Benutzer-ID, die Aktion und den Zeitpunkt. Mindestens ein aktives
        Konto mit Mitarbeiterrolle und Kontoverwaltungsrecht muss verbleiben.
        PropertyFlow prüft dies auch bei gleichzeitigen Verwaltungsaktionen.

        Ab dem nächsten Zugriff prüft PropertyFlow im Web und über MCP
        serverseitig den aktuellen Kontostand und die aktuelle Rolle.
        Das gilt auch für bestehende Browsersitzungen und MCP-Delegationen.
        Betroffene Lese- und Schreibzugriffe im Mitarbeiterbereich werden
        abgewiesen. Ein gesperrtes Konto erhält keine neue Mitarbeitersitzung.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [action, operation, csrf]
              properties:
                action:
                  type: string
                  enum: [konto-sperren, rolle-entziehen]
                  description: Gewählte Verwaltungsaktion für das adressierte Konto.
                operation:
                  type: string
                  minLength: 1
                  x-propertyflow-max-utf16-code-units: 80
                  description: An das Zielkonto gebundene Absende-ID aus dem Formular.
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
      responses:
        '200':
          description: >
            Die Kontosperre oder der Rollenentzug ist dauerhaft gespeichert
            und auditiert. Die Antwort zeigt die bestätigte Aktion in der
            geschützten Kontoverwaltung. Eine identische Wiederholung
            bestätigt denselben Vorgang. Ist der gewünschte Zustand bereits
            erreicht, bestätigt die Antwort diesen Zustand ohne weitere Änderung.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/Html'
        '400':
          description: Die Benutzer-ID oder die Formulareingabe fehlt oder ist ungültig.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          description: >
            Aktive Mitarbeiterrolle, Zusatzrecht «Mitarbeiterkonten verwalten»
            oder gültiger CSRF-Nachweis fehlen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '404':
          description: Das Mitarbeiterkonto ist nicht verfügbar. Die Antwort enthält keine Kontodaten.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '409':
          description: >
            Die Aktion würde dem letzten aktiven Konto mit
            Kontoverwaltungsrecht den Verwaltungszugriff entziehen, oder die
            Absende-ID wurde für dieses Zielkonto mit einer anderen Aktion
            verwendet. Der Dienst lehnt die Änderung ab.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '500':
          description: >
            Die Änderung kann wegen eines technischen Fehlers nicht
            bestätigt werden. Das UI lädt den aktuellen Kontostand neu.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
      x-propertyflow-idempotency:
        key: operation
        scope: Handelndes Konto und Zielkonto nach erneuter Zugriffsprüfung.
        rule: >
          Dieselbe Absende-ID mit derselben Aktion bestätigt den bereits
          verarbeiteten Vorgang mit 200 und erzeugt keinen weiteren
          Audit-Eintrag. Dieselbe ID mit einer anderen Aktion ergibt 409.
  /mitarbeiter/faelle/{id}/kritische-entscheidung:
    parameters:
      - $ref: '#/components/parameters/StaffCaseId'
    post:
      operationId: mitarbeiterKritischeEntscheidungTreffen
      tags: [Mitarbeitende]
      summary: Kritische Fallentscheidung treffen
      x-propertyflow-status: zielvertrag
      description: >
        Ein berechtigter Mitarbeiter trifft im Web eine persönliche
        Entscheidung für genau die angezeigte kritische Handlung. Jede
        native Camunda User Task für diese Entscheidung gehört zu genau
        einer serverseitig geführten Handlung mit ihren geprüften Angaben.
        Ändert sich die Handlung, muss der Prozess eine neue Aufgabe mit
        eigenem Schlüssel bereitstellen. PropertyFlow prüft Mitarbeiterrolle,
        Fall- und Aktionsberechtigung, Fallversion sowie die Zuordnung der
        offenen Aufgabe zur Handlung und zum führenden Fallprozess.
        PropertyFlow schliesst genau diese User Task synchron in Camunda ab
        (UC-027, FALL-10, ADR-002).

        Camunda übernimmt den Entscheid und bestimmt den Folgeschritt.
        PropertyFlow speichert intern den Entscheid, die Handlung, die
        Begründung, die handelnde Benutzer-ID aus der geprüften Sitzung und
        den Zeitpunkt. Nur «freigeben» gilt als Freigabe für die konkrete
        Handlung. «ablehnen» und «klaeren» werden ohne Freigabe gespeichert.
        Eine andere Handlung benötigt eine eigene Entscheidung. Der Dienst
        prüft bei einer späteren delegierten kritischen Aktion den passenden
        Freigabenachweis serverseitig. Allfällige externe Beauftragungen
        organisiert die Verwaltung ausserhalb von PropertyFlow. Für einen
        Fallabschluss gelten die Regeln aus UC-014.
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [userTaskKey, version, decision, reason, operation, csrf]
              properties:
                userTaskKey:
                  type: string
                  pattern: '^[0-9]+$'
                  description: Schlüssel der angezeigten Camunda User Task als Dezimalzeichenfolge.
                version:
                  type: integer
                  format: int64
                  description: Version des beim Entscheid geprüften Fallstands.
                decision:
                  type: string
                  enum: [freigeben, ablehnen, klaeren]
                  description: Die konkrete Handlung freigeben, ablehnen oder weitere Klärung verlangen.
                reason:
                  type: string
                  pattern: '\S'
                  description: Fachliche Begründung für den internen Entscheidungsnachweis.
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
      responses:
        '200':
          description: >
            Camunda hat den Abschluss der konkreten User Task bestätigt.
            Der dazugehörige Entscheid und sein Audit-Nachweis sind dauerhaft
            gespeichert. Die Antwort enthält keinen Körper. Das UI lädt den
            gespeicherten Fallstand neu.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          description: >
            Ungültige Eingabe, veralteter Fallstand oder unzulässige Aufgabe.
            Das gilt auch bei einer geänderten Handlung, einer inzwischen
            beendeten Aufgabe oder einer Aufgabe aus einem anderen Fall.
            Das UI lädt den aktuellen Fallstand. Eine neue Aufgabe bleibt offen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          description: >
            Mitarbeiterrolle, Berechtigung für die konkrete Aktion oder
            gültiger CSRF-Nachweis fehlen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '409':
          description: Die Absende-ID wurde in diesem Fall bereits mit anderen Entscheidungsdaten verwendet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '500':
          description: >
            Ein technischer Fehler oder Timeout verhindert die Bestätigung
            des Entscheids. Camunda kann die Aufgabe bereits abgeschlossen
            haben. Das UI lädt den gespeicherten Fallstand neu und behält die
            Absende-ID. PropertyFlow wiederholt den Auftrag nicht automatisch.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall und handelndes Konto nach erneuter Zugriffsprüfung.
        rule: >
          Eine identische Wiederholung eines bestätigten Entscheids ergibt
          erneut 200 und erzeugt keinen weiteren Audit-Eintrag. Die Absende-ID
          ist an die ursprüngliche Fallversion, Aufgabe, Entscheidung und
          Begründung gebunden. Geänderte Entscheidungsdaten ergeben 409.
  /mitarbeiter/fallzugaenge/{id}/link-ersetzen:
    parameters:
      - $ref: '#/components/parameters/StaffCaseId'
    post:
      operationId: mitarbeiterFallLinkErsetzen
      tags: [Mitarbeitende]
      summary: Persönlichen Fall-Link ersetzen
      x-propertyflow-status: zielvertrag
      x-propertyflow-required-permission: Fallzugänge verwalten
      description: >
        Die geschützte Fallzugangsverwaltung ersetzt einen verlorenen oder
        kompromittierten Link für den über {id} bestimmten Fall (UC-024).
        Der Prüfnachweis muss die Identität und die aktuell gespeicherte
        Kontaktadresse bestätigen. PropertyFlow aktiviert einen neuen
        unabhängigen Token und sperrt den bisherigen in derselben Transaktion.
        Case-ID, Historie und Bearbeitungsstatus bleiben erhalten. Beim
        nächsten Aufruf sperrt PropertyFlow Lesen und Schreiben über den
        alten Link.

        PropertyFlow prüft Mitarbeitersitzung, Zusatzrecht «Fallzugänge
        verwalten», CSRF und Fallberechtigung. Es prüft den serverseitigen
        Nachweis für dieselbe einmalige Aktion, denselben Fall, die handelnde
        Person, den aktuellen Fallstand und die bestätigte Adresse. Änderung,
        Verbrauch des Prüfnachweises, Audit und genau ein logischer
        Versandauftrag werden gemeinsam gespeichert. Das Audit hält Fall,
        Handlung, Mitarbeiter, Zeitpunkt und Prüfreferenz fest. Klartexttoken
        und Identitätsbelege bleiben aus Antwort und Audit. Die Aktion gehört
        zur separaten Fallzugangsverwaltung und ist unabhängig von Camunda
        (ZUG-05, ZUG-06).
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [version, verificationId, operation, csrf]
              properties:
                version:
                  $ref: '#/components/schemas/FallzugangVersion'
                verificationId:
                  $ref: '#/components/schemas/FallzugangPruefnachweis'
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
      responses:
        '204':
          description: >
            Der neue Link ist aktiv und der alte Token dauerhaft gesperrt.
            Audit und Versandauftrag sind gespeichert. Die Antwort enthält
            weder einen Körper noch den neuen Link. Der Versand folgt
            nachgelagert an die bestätigte Kontaktadresse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          $ref: '#/components/responses/FallzugangUngueltigeEingabe'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/FallzugangVerwaltungVerweigert'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '409':
          $ref: '#/components/responses/FallzugangVerwaltungKonflikt'
        '500':
          $ref: '#/components/responses/FallzugangVerwaltungFehler'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall, handelndes Konto und Verwaltungsaktion nach erneuter Zugriffsprüfung.
        rule: >
          Eine identische Wiederholung eines bestätigten Vorgangs erhält
          erneut 204, auch wenn der Prüfnachweis inzwischen verbraucht ist.
          PropertyFlow prüft dies vor einer neuen Änderung. Geänderte Daten
          unter derselben ID ergeben 409. Wiederholungen erzeugen weder
          einen weiteren Token noch einen weiteren Versandauftrag.
  /mitarbeiter/fallzugaenge/{id}/kontaktadresse-aendern:
    parameters:
      - $ref: '#/components/parameters/StaffCaseId'
    post:
      operationId: mitarbeiterFallKontaktadresseAendern
      tags: [Mitarbeitende]
      summary: Fall-Kontaktadresse ändern
      x-propertyflow-status: zielvertrag
      x-propertyflow-required-permission: Fallzugänge verwalten
      description: >
        Die geschützte Fallzugangsverwaltung korrigiert die Kontaktadresse
        desselben Mieters (UC-025). PropertyFlow prüft und vereinheitlicht
        die eingegebene Adresse gemäss ZUG-04. Der Prüfnachweis muss die
        Identität und genau diese neue Adresse bestätigen. In derselben
        Transaktion speichert PropertyFlow die aktuelle Adresse, aktiviert
        einen neuen unabhängigen Link und sperrt den bisherigen Token.
        Ursprüngliche Einreichungsdaten, Case-ID, Historie und Bearbeitungsstatus
        bleiben erhalten. Ab dem nächsten Aufruf gilt die neue Adresse für
        die Zuordnung zum verifizierten Mieterkonto im Web und über MCP.
        Anmeldedaten eines Kontos werden durch die Aktion nicht geändert.

        PropertyFlow prüft Mitarbeitersitzung, Zusatzrecht «Fallzugänge
        verwalten», CSRF und Fallberechtigung. Es prüft den serverseitigen
        Nachweis für dieselbe einmalige Aktion, denselben Fall, die handelnde
        Person, den aktuellen Fallstand und die bestätigte Adresse. Änderung,
        Verbrauch des Prüfnachweises, Audit und genau ein logischer
        Versandauftrag werden gemeinsam gespeichert. Das Audit hält Fall,
        Handlung, Mitarbeiter, Zeitpunkt und Prüfreferenz fest. Klartexttoken
        und Identitätsbelege bleiben aus Antwort und Audit. Die Aktion gehört
        zur separaten Fallzugangsverwaltung und ist unabhängig von Camunda
        (ZUG-05, ZUG-06).
      security:
        - BrowserSession: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [version, verificationId, operation, csrf, email]
              properties:
                version:
                  $ref: '#/components/schemas/FallzugangVersion'
                verificationId:
                  $ref: '#/components/schemas/FallzugangPruefnachweis'
                operation:
                  $ref: '#/components/schemas/StaffOperation'
                csrf:
                  $ref: '#/components/schemas/StaffCsrf'
                email:
                  type: string
                  pattern: '\S'
                  description: Neue Kontaktadresse des geprüften Mieters gemäss der gemeinsamen E-Mail-Regel in ZUG-04.
      responses:
        '204':
          description: >
            Neue Kontaktadresse und Link sind dauerhaft gespeichert. Der
            alte Token ist gesperrt. Audit und Versandauftrag sind gespeichert.
            Die Antwort enthält weder einen Körper noch den neuen Link. Der
            Versand folgt nachgelagert an die neue bestätigte Kontaktadresse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Referrer-Policy:
              $ref: '#/components/headers/NoReferrer'
        '400':
          $ref: '#/components/responses/FallzugangUngueltigeEingabe'
        '401':
          $ref: '#/components/responses/StaffWriteNeedsLogin'
        '403':
          $ref: '#/components/responses/FallzugangVerwaltungVerweigert'
        '404':
          $ref: '#/components/responses/FallNichtVerfuegbar'
        '409':
          $ref: '#/components/responses/FallzugangVerwaltungKonflikt'
        '500':
          $ref: '#/components/responses/FallzugangVerwaltungFehler'
      x-propertyflow-idempotency:
        key: operation
        scope: Fall, handelndes Konto und Verwaltungsaktion nach erneuter Zugriffsprüfung.
        rule: >
          Eine identische Wiederholung eines bestätigten Vorgangs erhält
          erneut 204, auch wenn der Prüfnachweis inzwischen verbraucht ist.
          PropertyFlow prüft dies vor einer neuen Änderung. Geänderte Daten
          unter derselben ID ergeben 409. Wiederholungen erzeugen weder
          einen weiteren Token noch einen weiteren Versandauftrag.
components:
  schemas:
    FallzugangVersion:
      type: integer
      format: int64
      description: Version des im Verwaltungsablauf geprüften Fallstands.
    FallzugangPruefnachweis:
      type: string
      pattern: '\S'
      description: >
        Referenz eines von PropertyFlow hinterlegten, befristeten und einmalig
        verwendbaren Prüfnachweises. Eine blosse Referenz ohne passenden
        serverseitigen Prüfnachweis berechtigt nicht zur Aktion.
    StaffFormulationAttemptId:
      type: string
      format: uuid
      description: Vom Browser neu erzeugte eindeutige ID für einen Formulierungsversuch.
    StaffOperation:
      type: string
      minLength: 1
      x-propertyflow-max-utf16-code-units: 80
      description: Fallgebundene Absende-ID aus dem Formular.
    StaffCsrf:
      type: string
      minLength: 1
      description: CSRF-Token aus dem Formular der Browsersitzung.
    StaffReturnTo:
      type: string
      format: uri-reference
      description: Optionales Rückkehrziel auf der lokalen Fallübersicht.
    Html:
      type: string
    MieternachrichtFormular:
      type: object
      required: [text, operation, csrf]
      properties:
        text:
          type: string
          minLength: 1
          x-propertyflow-max-utf16-code-units: 2000
          description: >
            Nachricht mit Inhalt. Der Server wandelt CRLF und CR in LF um
            und prüft höchstens 2’000 UTF-16-Codeeinheiten vor dem
            Entfernen äusserer Leerzeichen.
        operation:
          type: string
          minLength: 1
          x-propertyflow-max-utf16-code-units: 80
          description: Fallgebundene Absende-ID aus dem Formular mit höchstens 80 UTF-16-Codeeinheiten.
        csrf:
          type: string
          minLength: 1
          description: CSRF-Token aus der Fallansicht, an die Browsersitzung gebunden.
  parameters:
    StaffCaseId:
      in: path
      name: id
      required: true
      description: Referenz des Falls. Die Case-ID gewährt für sich keinen Zugriff.
      schema:
        type: string
        minLength: 1
    FallToken:
      name: token
      in: path
      required: true
      description: >
        Vertraulicher Token des persönlichen Links. PropertyFlow prüft den
        Token bei jedem Aufruf. Der Token und die URL mit dem Token gehören
        nicht in technische Protokolle.
      schema:
        type: string
        minLength: 1
  headers:
    BrowserLocation:
      required: true
      description: Ziel der Weiterleitung als relative URL.
      schema:
        type: string
        format: uri-reference
    PersonalCaseLocation:
      required: true
      description: >
        Pfad der persönlichen Fallansicht mit vertraulichem Zugangstoken.
        Bei einem konfigurierten Anwendungspfad steht dieser vor /mieter/fall.
      schema:
        type: string
        format: uri-reference
        pattern: '^/(?:[^/?#]+/)*mieter/fall/zugang/[^/?#]+$'
    NoStore:
      required: true
      schema:
        const: no-store
    NoReferrer:
      required: true
      schema:
        const: no-referrer
  responses:
    FallzugangUngueltigeEingabe:
      description: Ein Formularfeld fehlt oder ist ungültig, oder das Formular enthält zusätzliche Felder.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    FallzugangVerwaltungVerweigert:
      description: >
        Aktive Mitarbeiterrolle, Fallberechtigung, Zusatzrecht
        «Fallzugänge verwalten» oder gültiger CSRF-Nachweis fehlen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    FallzugangVerwaltungKonflikt:
      description: >
        Der Fallstand wurde geändert, der Prüfnachweis ist unbekannt,
        fehlt im Prüfbestand, passt nicht zur Aktion oder ist abgelaufen
        oder bereits verbraucht. Auch geänderte Eingaben mit derselben
        Absende-ID ergeben 409. Der gespeicherte Fallzugang wird durch
        diesen Aufruf nicht geändert.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    FallzugangVerwaltungFehler:
      description: >
        Die Änderung kann wegen eines technischen Fehlers nicht bestätigt
        werden. Bei verloren gegangener Bestätigung kann sie bereits
        gespeichert sein. Eine Wiederholung verwendet dieselben Eingaben
        und dieselbe Absende-ID.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    StaffLoginRedirect:
      description: >
        Bei Seitennavigation ohne gültige Mitarbeiteranmeldung verweist
        Location auf das Anmeldeformular. PropertyFlow merkt das zulässige
        Rückkehrziel serverseitig vor.
      headers:
        Location:
          $ref: '#/components/headers/BrowserLocation'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    StaffReadNeedsLogin:
      description: Hintergrundabruf ohne gültige Anmeldung. Die Antwort enthält keine Falldaten.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    StaffReadDenied:
      description: >
        Die Anmeldung gewährt keine Mitarbeiterrechte. Die Antwort
        enthält keine Falldaten. Bei Seitennavigation liefert sie
        einen verständlichen Zugriffshinweis.
      headers:
        X-PropertyFlow-Access:
          schema:
            type: string
            const: denied
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/plain:
          schema:
            type: string
    StaffDetailRedirect:
      description: >
        Die lokale Demo hat die Eingabe verarbeitet. Location verweist
        auf dasselbe Mitarbeiter-Falldetail.
      headers:
        Location:
          $ref: '#/components/headers/BrowserLocation'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    StaffWriteNeedsLogin:
      description: Die Anmeldung für die Schreibaktion fehlt oder ist abgelaufen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    StaffWriteDenied:
      description: Fehlende Mitarbeiterrechte oder fehlender oder ungültiger CSRF-Nachweis.
      headers:
        X-PropertyFlow-Access:
          description: Wird bei fehlenden Mitarbeiterrechten gesetzt.
          schema:
            type: string
            const: denied
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
    HtmlAnsicht:
      description: HTML-Ansicht erfolgreich geladen.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/Html'
    InvalidCsrf:
      description: Die Browsersitzung oder der zugehörige CSRF-Nachweis fehlt oder ist ungültig.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/Html'
    FallNichtVerfuegbar:
      description: Der Fall ist nicht verfügbar. Die Antwort enthält keine Falldaten.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/Html'
    MieternachrichtUngueltig:
      description: >
        Ein Formularfeld fehlt oder ist ungültig. Bei zu langem Text zeigt
        das Formular die vollständige Eingabe mit einem Hinweis zur
        Längengrenze. Der Verlauf bleibt unverändert.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/Html'
    MieternachrichtKonflikt:
      description: >
        Der Fallprozess ist noch nicht gestartet, der Fall ist abgeschlossen
        oder dieselbe Absende-ID wurde bereits mit anderem Text gespeichert.
        Es entsteht kein neuer Eintrag. Bei ausstehendem Prozessstart oder
        Konflikt der Absende-ID bleibt der Text im Formular. Bei bestätigtem
        Fallabschluss verwirft die Fallansicht ungesendeten Text und blendet
        die Eingabe aus.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/Html'
    MieternachrichtFehler:
      description: >
        Bei einem technischen Fehler oder Timeout gibt PropertyFlow das
        HTML-Formular mit dem vollständigen Text, derselben Absende-ID und
        einem Fehlerhinweis zurück. Ist Camunda schon bei der Vorprüfung
        unerreichbar, bleibt eine neue Nachricht ungespeichert. Scheitert
        die Bestätigung der Korrelation nach dem Commit, bleibt der
        gespeicherte Verlaufseintrag erhalten. Bei einem Timeout kann die
        Korrelation bereits erfolgt sein.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/html:
          schema:
            $ref: '#/components/schemas/Html'
    FallLinkNichtVerfuegbar:
      description: >
        Der Link ist unbekannt, ungültig oder ersetzt. Die Antwort enthält
        keine Falldaten und bestätigt keine Fall- oder Kontaktzuordnung.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/html:
          schema:
            type: string
    FallzugriffRateLimit:
      description: Das Rate Limit für den Aufruf wurde erreicht.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Referrer-Policy:
          $ref: '#/components/headers/NoReferrer'
      content:
        text/html:
          schema:
            type: string
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >
        Sitzungscookie aus dem Formularaufruf oder der Anmeldung. Schreibende
        Formulare benötigen zusätzlich einen CSRF-Token. Konto und Rolle
        werden für geschützte Routen serverseitig geprüft.
