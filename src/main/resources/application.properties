spring.application.name=propertyflow
spring.docker.compose.enabled=false
server.port=8081

spring.datasource.url=jdbc:h2:mem:propertyflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

camunda.client.enabled=true
camunda.client.base-url=http://localhost:8080
camunda.client.auth.method=none
management.health.camunda.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
