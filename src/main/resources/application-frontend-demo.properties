# Local UI fixture adapter. Case data stays in memory; the staff login uses a configured test address.
spring.config.import=optional:file:./.propertyflow-local/staff-bootstrap.properties[encoding=utf-8]
server.address=127.0.0.1
camunda.client.enabled=false
management.health.camunda.enabled=false
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
spring.thymeleaf.cache=false

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties[mail.smtp.auth]=${PROPERTYFLOW_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${PROPERTYFLOW_SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.starttls.required]=${PROPERTYFLOW_SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
propertyflow.staff.mail.from=propertyflow@example.test
