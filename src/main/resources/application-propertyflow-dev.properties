# Lokaler integrierter Betrieb: echte PostgreSQL-Daten und Camunda, KI optional.
spring.config.import=optional:file:./.propertyflow-local/runtime.properties[encoding=utf-8]
propertyflow.workflow.enabled=true
propertyflow.case-mail.enabled=true
camunda.client.enabled=true
camunda.client.rest-address=${PROPERTYFLOW_CAMUNDA_URL:http://127.0.0.1:8080}
camunda.client.grpc-address=${PROPERTYFLOW_CAMUNDA_GRPC_URL:http://127.0.0.1:26500}
camunda.client.auth.method=none
management.health.camunda.enabled=true
propertyflow.public-base-url=http://127.0.0.1:8081
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties[mail.smtp.auth]=false
spring.mail.properties[mail.smtp.starttls.enable]=false
spring.mail.properties[mail.smtp.starttls.required]=false
