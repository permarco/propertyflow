# Durable intake, workflow workers, staff actions and independent case mail. Workflow/mail activation is explicit.
spring.config.import=optional:file:./.propertyflow-local/backend.properties[encoding=utf-8]
server.address=127.0.0.1
spring.datasource.url=${PROPERTYFLOW_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/propertyflow}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PROPERTYFLOW_DATABASE_USER:propertyflow}
spring.datasource.password=${PROPERTYFLOW_DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.flyway.locations=classpath:db/backend-migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Required external 32-byte Base64 key. Preserve it across application restarts.
propertyflow.links.encryption-key=${PROPERTYFLOW_LINK_KEY}

propertyflow.workflow.enabled=${PROPERTYFLOW_WORKFLOW_ENABLED:false}
camunda.client.enabled=${propertyflow.workflow.enabled}
camunda.client.rest-address=${PROPERTYFLOW_CAMUNDA_URL:http://localhost:8080}
camunda.client.grpc-address=${PROPERTYFLOW_CAMUNDA_GRPC_URL:http://localhost:26500}
camunda.client.prefer-rest-over-grpc=true
camunda.client.request-timeout=10s
management.health.camunda.enabled=${propertyflow.workflow.enabled}
propertyflow.workflow.definition-key=${PROPERTYFLOW_PROCESS_DEFINITION_KEY:0}
propertyflow.workflow.tenant-id=${PROPERTYFLOW_CAMUNDA_TENANT:<default>}
propertyflow.case-mail.enabled=${PROPERTYFLOW_CASE_MAIL_ENABLED:false}
propertyflow.case-mail.definition-key=${PROPERTYFLOW_MAIL_DEFINITION_KEY:0}
propertyflow.case-mail.from=${PROPERTYFLOW_CASE_MAIL_FROM:propertyflow@example.test}
propertyflow.public-base-url=${PROPERTYFLOW_PUBLIC_BASE_URL:http://localhost:8081}
spring.ai.model.chat=${PROPERTYFLOW_TRIAGE_PROVIDER:none}
propertyflow.triage.timeout=${PROPERTYFLOW_TRIAGE_TIMEOUT:20s}
propertyflow.recommendation.knowledge-directory=${PROPERTYFLOW_KNOWLEDGE_DIRECTORY:}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PROPERTYFLOW_HTTPS:false}
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

spring.mail.host=${PROPERTYFLOW_SMTP_HOST:127.0.0.1}
spring.mail.port=${PROPERTYFLOW_SMTP_PORT:1025}
spring.mail.properties[mail.smtp.auth]=${PROPERTYFLOW_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${PROPERTYFLOW_SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.starttls.required]=${PROPERTYFLOW_SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
propertyflow.staff.mail.from=${PROPERTYFLOW_STAFF_MAIL_FROM:propertyflow@example.test}
