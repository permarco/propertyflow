<!doctype html><html lang="de" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{demo/fragments :: head('Fallübersicht')}"></head><body class="list-page"><header th:replace="~{demo/fragments :: header}"></header><main>
<h1>Fallübersicht</h1><section class="card filters"><form action="/mitarbeiter/faelle" id="filters">
<div class="filter-grid"><div><label for="q">Fälle durchsuchen</label><input type="search" name="q" id="q" maxlength="200" placeholder="Case-ID, Betreff, Objekt oder Nachrichteninhalt" th:value="${q}"></div><div><label for="urgency">Dringlichkeit</label><select id="urgency" name="urgency"><option value="">Alle</option><option th:each="u : ${urgencies}" th:value="${u}" th:text="${u}" th:selected="${u == urgency}"></option></select></div>
<div class="mobile-sort"><label for="sort">Sortieren nach</label><select id="sort" name="sort"><option value="default" th:selected="${sort == 'default'}">Standardsortierung</option><option th:each="key,s : ${keys}" th:value="${key}" th:text="${columns[s.index]}" th:selected="${key == sort}"></option></select></div><div class="mobile-sort"><label for="desc">Richtung</label><select id="desc" name="desc"><option value="false" th:selected="${!desc}">Aufsteigend ↑</option><option value="true" th:selected="${desc}">Absteigend ↓</option></select></div></div>
<div class="actions"><label class="toggle"><input id="closed" type="checkbox" role="switch" name="closed" value="true" th:checked="${closed}">Abgeschlossene Fälle</label><a class="button secondary push-right" id="reset" href="/mitarbeiter/faelle">Filter zurücksetzen</a></div><noscript><button>Suchen / Filter anwenden</button></noscript>
</form></section><p id="load-state" role="status" aria-live="polite"></p><section id="results" tabindex="-1" th:attr="data-page=${result.page}">
<p class="result-count" th:text="${result.total + ' Fälle'}"></p><div class="card table-card" tabindex="0" role="region" aria-label="Fallliste"><table><thead><tr><th th:each="key,s : ${keys}" scope="col" th:attr="aria-sort=${sort == key ? (desc ? 'descending' : 'ascending') : 'none'}"><a th:href="@{/mitarbeiter/faelle(q=${q},urgency=${urgency},closed=${closed},sort=${key},desc=${sort == key ? !desc : false})}" th:text="${columns[s.index] + (sort == key ? (desc ? ' ↓' : ' ↑') : '')}"></a></th></tr></thead><tbody>
<tr th:each="c : ${result.items}" th:attr="data-case=${c.id}"><td data-label="Fall"><a class="case-link" th:href="@{/mitarbeiter/faelle/{id}(id=${c.id},returnTo=${listReturnTo})}" th:text="${c.id}"></a><p th:text="${c.title}"></p></td><td data-label="Objekt / Wohnung"><span th:text="${#strings.isEmpty(c.unit) ? c.originalUnit : c.unit}"></span><small th:unless="${#strings.isEmpty(c.unit)}">Zugeordnet</small></td><td class="date" data-label="Eingang" th:text="${c.receivedText()}"></td><td class="date" data-label="Letzte Aktion des Mieters" th:text="${c.contactText()}"></td><td data-label="Wiedervorlage" th:text="${c.followUp == null ? '–' : c.followUpText()}" th:title="${c.followUpText()}"></td><td data-label="Dringlichkeit"><span class="badge" th:classappend="${c.urgencyClass()}" th:text="${c.urgency}"></span></td><td data-label="Bearbeitungsstatus"><span class="badge" th:text="${c.status}"></span></td></tr></tbody></table><div th:if="${result.total == 0}" class="empty"><h2 th:text="${emptyTitle}"></h2><p th:text="${emptyHint}"></p></div></div>
<nav class="pagination" aria-label="Seitennavigation"><a class="button secondary" th:if="${result.page > 1}" th:href="@{/mitarbeiter/faelle(q=${q},urgency=${urgency},closed=${closed},sort=${sort},desc=${desc},page=${result.page - 1})}">← Rückwärts</a><button th:unless="${result.page > 1}" disabled>← Rückwärts</button><span th:text="${'Seite ' + result.page + ' von ' + result.pages}"></span><a class="button secondary" th:if="${result.page < result.pages}" th:href="@{/mitarbeiter/faelle(q=${q},urgency=${urgency},closed=${closed},sort=${sort},desc=${desc},page=${result.page + 1})}">Vorwärts →</a><button th:unless="${result.page < result.pages}" disabled>Vorwärts →</button></nav>
</section></main></body></html>
