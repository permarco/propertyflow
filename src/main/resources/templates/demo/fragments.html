<!doctype html><html lang="de" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="header" class="app-header"><a href="/" class="brand" aria-label="PropertyFlow Demo-Start"><span class="brand-mark" aria-hidden="true">▰▥</span> PropertyFlow</a><span class="area" th:text="${staff ? 'Mitarbeiterbereich' : 'Mieteranliegen'}"></span><span class="demo-badge">Lokale Demo · Testdaten</span><a th:if="${staff}" th:href="${returnTo}" class="button secondary">Zur Fallübersicht</a><div th:replace="~{demo/fragments :: account}"></div></header>
<div th:fragment="account" class="account-menu" th:if="${currentAccountEmail != null}">
<a th:if="${tenantSignedIn}" th:href="@{/mieter/faelle}" class="button secondary">Meine Fälle</a>
<div class="account-identity"><span>Angemeldet als</span><strong th:text="${currentAccountEmail}"></strong></div>
<form th:action="@{/abmelden}" method="post"><input type="hidden" name="csrf" th:value="${csrf}"><button class="secondary" type="submit">Abmelden</button></form>
</div>
</body></html>
