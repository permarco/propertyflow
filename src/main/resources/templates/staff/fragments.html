<!doctype html>
<html lang="de-CH" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tenant/fragments :: head('Mitarbeiterbereich')}"></head>
<body>
<header class="app-header" th:fragment="header(listTarget, csrf)">
    <a class="brand" th:href="@{/mitarbeiter/faelle}">
        <span class="brand-mark" aria-hidden="true">▰▥</span>
        PropertyFlow
    </a>
    <span class="area">Mitarbeiterbereich</span>
    <a th:if="${listTarget != null}" class="button secondary" th:href="@{${listTarget}}">Zur Fallübersicht</a>
    <div class="account-menu">
        <form th:action="@{/abmelden}" method="post">
            <input type="hidden" name="csrf" th:value="${csrf}">
            <button class="secondary" type="submit">Abmelden</button>
        </form>
    </div>
</header>
</body>
</html>
