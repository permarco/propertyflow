# Optional database infrastructure for the later persistence stage.
# Frontend demo / Mailpit: dev/compose.yaml. Test setup: src/test/README.md.
services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
