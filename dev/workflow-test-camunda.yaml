camunda:
  process-instance-creation:
    business-id-uniqueness-enabled: true
  system:
    cpu-thread-count: 2
    io-thread-count: 2
  security:
    authentication:
      method: basic
      unprotectedApi: true
    authorizations:
      enabled: false
    initialization:
      users:
        - username: test
          password: test
          name: Workflow Test
          email: workflow@example.test
      defaultRoles.admin.users:
        - test
  data:
    secondary-storage:
      type: rdbms
      rdbms:
        url: jdbc:h2:file:./camunda-data/h2db
        username: sa
        password:
        flushInterval: PT0.1S
  backup:
    webapps:
      enabled: false
