name: propertyflow-integration

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: propertyflow_e2e
      POSTGRES_USER: propertyflow_e2e
      POSTGRES_PASSWORD: propertyflow_e2e
    ports:
      - "127.0.0.1:5440:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propertyflow_e2e -d propertyflow_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  camunda-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: camunda
      POSTGRES_USER: camunda
      POSTGRES_PASSWORD: camunda_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camunda -d camunda"]
      interval: 2s
      timeout: 3s
      retries: 30

  camunda:
    image: camunda/camunda:8.9.19
    mem_limit: 2g
    ports:
      - "127.0.0.1:8086:8080"
      - "127.0.0.1:26506:26500"
    environment:
      CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_PASSWORD: camunda_e2e
    tmpfs:
      - /usr/local/camunda/data:uid=1001,gid=1001
      - /usr/local/camunda/camunda-data:uid=1001,gid=1001
    volumes:
      - ./runtime-camunda.yaml:/usr/local/camunda/config/application.yaml:ro
    depends_on:
      camunda-postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:1028:1025"
      - "127.0.0.1:8028:8025"
