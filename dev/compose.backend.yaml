name: propertyflow-backend

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: propertyflow
      POSTGRES_USER: propertyflow
      POSTGRES_PASSWORD: ${PROPERTYFLOW_DATABASE_PASSWORD:?Set PROPERTYFLOW_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - backend-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propertyflow -d propertyflow"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  backend-data:
